subject: trigonometry
tricks:
  - id: trig-sin-plus-cos
    family: identity
    name: "sinθ + cosθ = k gives sinθcosθ = (k²−1)/2"
    subject: trigonometry
    topic: identities sin cos
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["sin ?θ ?\\+ ?cos", "sinθ \\+ cosθ", "sin x \\+ cos x", "sin.*\\+.*cos"]
    when: "sin + cos (or sin − cos) is given and a product or power is needed."
    idea: "Square it: 1 + 2 sinθcosθ = k². Then sin⁴+cos⁴ = 1 − 2sin²cos² and sin⁶+cos⁶ = 1 − 3sin²cos²."
    steps: ["Square both sides.", "Use sin²+cos² = 1 to get sinθcosθ.", "Use the sin⁴+cos⁴ identity if asked."]
    example: {question: "sinθ + cosθ = √2. Find sinθcosθ.", answer: "1/2", seconds: 8}
    speed_seconds: 8
    proof: {kind: identity, vars: [t], lhs: "(sin(t) + cos(t))**2 - 1", rhs: "2*sin(t)*cos(t)"}

  - id: trig-sin4-cos4
    family: identity
    name: "sin⁴ + cos⁴ = 1 − 2sin²cos²"
    subject: trigonometry
    topic: identities powers
    exams: [SSC CGL, SSC CHSL]
    triggers: ["sin\\^4", "sin⁴", "cos⁴", "sin\\^6", "sin⁶"]
    when: "Fourth or sixth powers of sin and cos."
    idea: "sin⁴+cos⁴ = 1 − 2sin²cos²; sin⁶+cos⁶ = 1 − 3sin²cos²."
    steps: ["Write as (sin²+cos²)² − 2sin²cos².", "Replace sin²+cos² with 1."]
    example: {question: "sin⁴+cos⁴ when sinθcosθ = 1/4", answer: "7/8", seconds: 8}
    speed_seconds: 8
    proof: {kind: identity, vars: [t], lhs: "sin(t)**4 + cos(t)**4", rhs: "1 - 2*sin(t)**2*cos(t)**2"}

  - id: trig-sec-tan
    family: identity
    name: "(sec+tan)(sec−tan) = 1"
    subject: trigonometry
    topic: identities sec tan cosec cot
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["sec", "tan", "cosec", "cot"]
    when: "sec±tan or cosec±cot appear."
    idea: "sec² − tan² = 1 so sec+tan and sec−tan are reciprocals. Same for cosec and cot."
    steps: ["Spot the pair.", "Use reciprocals to get the other value, then add or subtract."]
    example: {question: "secθ + tanθ = 2. Find secθ − tanθ.", answer: "1/2", seconds: 4}
    speed_seconds: 4
    proof: {kind: identity, vars: [t], lhs: "(sec(t) + tan(t))*(sec(t) - tan(t))", rhs: "1"}

  - id: trig-tan-cot-sum
    family: identity
    name: "tanθ + cotθ = secθ cosecθ"
    subject: trigonometry
    topic: identities tan cot
    exams: [SSC CGL, SSC CHSL]
    triggers: ["tan.*\\+.*cot", "tanθ \\+ cotθ", "secθ cosecθ"]
    when: "tanθ + cotθ appears."
    idea: "tanθ + cotθ = 1/(sinθcosθ) = secθ·cosecθ."
    steps: ["Combine into one fraction.", "Use sin²+cos² = 1."]
    example: {question: "Simplify tanθ + cotθ", answer: "secθ cosecθ", seconds: 6}
    speed_seconds: 6
    proof: {kind: identity, vars: [t], lhs: "tan(t) + cot(t)", rhs: "sec(t)*csc(t)"}

  - id: trig-complementary
    name: "Complementary angles pair off"
    subject: trigonometry
    topic: complementary angles sin cos
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["sin 1°", "sin ?1°", "tan 1°", "tan 89", "cos 89", "complementary"]
    when: "A product or sum like tan1°·tan2°···tan89° or sin²1°+sin²89°."
    idea: "sin(90°−θ) = cosθ, tan(90°−θ) = cotθ. Pairs cancel: tanθ·tan(90°−θ) = 1 and sin²θ+sin²(90°−θ) = 1."
    steps: ["Pair the first with the last angle (sum 90°).", "Each pair gives 1; middle term tan45° = 1."]
    example: {question: "tan1°·tan2°···tan89°", answer: "1", seconds: 5}
    speed_seconds: 5
    proof: {kind: identity, vars: [t], lhs: "sin(pi/2 - t)", rhs: "cos(t)"}

  - id: trig-values-table
    name: "Standard angle value table"
    subject: trigonometry
    topic: standard angles values
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["sin 30", "cos 60", "tan 45", "sin 60", "cos 30", "tan 60"]
    when: "Any question with 0°, 30°, 45°, 60° or 90°."
    idea: "sin: 0, 1/2, 1/√2, √3/2, 1. cos is the reverse. tan: 0, 1/√3, 1, √3, ∞."
    steps: ["Write the sin row (√0, √1, √2, √3, √4 over 2).", "Read cos in reverse."]
    example: {question: "sin30° + cos60°", answer: "1", seconds: 3}
    speed_seconds: 3
    proof: {kind: numeric, expr: "sin(pi/6)", expected: "1/2"}

  - id: trig-angles-sum-45
    name: "(1+tanA)(1+tanB) = 2 when A+B = 45°"
    subject: trigonometry
    topic: tan sum forty five
    exams: [SSC CGL, SSC CHSL]
    triggers: ["tan.*\\+ ?1", "\\(1 ?\\+ ?tan", "A ?\\+ ?B ?= ?45", "45°"]
    when: "Product of (1+tanA)(1+tanB) with A + B = 45° (or (1−cotA)(1−cotB) type)."
    idea: "tan(A+B) = 1 means tanA + tanB + tanA·tanB = 1, so (1+tanA)(1+tanB) = 2."
    steps: ["Check A + B = 45°.", "Answer 2 directly."]
    example: {question: "(1+tan20°)(1+tan25°)", answer: "2", seconds: 4}
    speed_seconds: 4
    proof: {kind: identity, vars: [a], lhs: "(1 + tan(a))*(1 + tan(pi/4 - a))", rhs: "2"}

  - id: trig-height-distance
    name: "Heights and distances ratio shortcut"
    subject: trigonometry
    topic: height distance elevation depression
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["angle of elevation", "angle of depression", "tower", "shadow", "flagstaff"]
    when: "Tower, pole or shadow problems with 30°, 45° or 60°."
    idea: "Use the side ratios: 30°-60°-90° is 1 : √3 : 2 and 45°-45°-90° is 1 : 1 : √2. Convert the whole question into these ratios."
    steps: ["Draw the right triangle.", "Label sides with the ratio for the angle.", "Scale with the one known length."]
    example: {question: "Elevation 30° at 30 m from the base. Height?", answer: "10√3 m", seconds: 10}
    speed_seconds: 10
    proof: {kind: numeric, expr: "30*tan(pi/6)", expected: "10*sqrt(3)"}

  - id: trig-plug-45-option
    family: plug_values
    name: "Plug θ = 45° (or 30°) to eliminate options"
    subject: trigonometry
    topic: options back substitution
    exams: [SSC CGL, SSC CHSL]
    triggers: ["simplify", "θ", "options", "equals"]
    when: "An identity question where options are trigonometric expressions."
    idea: "Put θ = 45° (or 30°) in the question and in each option. Options that do not match are wrong."
    steps: ["Evaluate the question at 45°.", "Evaluate each option at 45°.", "Keep matches; test 30° if two remain."]
    example: {question: "secθ − tanθ·sinθ = ? Options: secθ, cosθ, sinθ, tanθ", answer: "cosθ (test θ = 60°: 2 − √3·√3/2 = 1/2 = cos60°)", seconds: 12}
    speed_seconds: 12
    caution: "Never use an angle that makes a term undefined (tan 90°, sec 90°, cot 0°) or makes two options equal; if two options still match, test a second angle."

  - id: trig-plug-theta-equation
    family: plug_values
    name: "Solve a trig equation by trying standard angles"
    subject: trigonometry
    topic: equations find theta standard angles
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["find θ", "find the value of θ", "0° ?< ?θ", "θ ?=", "2 ?sinθ", "sinθ ?= ", "cosθ ?= ", "tanθ ?= ", "0 ?< ?θ ?< ?90"]
    when: "A trig equation with θ between 0° and 90° and options that are standard angles."
    idea: "Do not solve algebraically. Put 30°, 45°, 60° (and 0°, 90°) into the equation using the value table; the angle that satisfies it is the answer."
    steps:
      - "Write the value table for the angles in the options."
      - "Evaluate the left side at the middle option first (usually 45° or 30°)."
      - "Move to the next option until both sides match."
    example: {question: "sinθ + cosθ = √2, 0° < θ < 90°. Find θ.", answer: "45°", seconds: 8}
    caution: "Only for acute angles from the standard table; check that the angle makes every term defined."
    speed_seconds: 8
    proof: {kind: numeric, expr: "sin(pi/4) + cos(pi/4)", expected: "sqrt(2)"}

  - id: trig-plug-angle-simplify
    family: plug_values
    name: "Simplify by putting θ = 30° or 60° (non-zero test angle)"
    subject: trigonometry
    topic: simplify expression identity options plugging
    exams: [SSC CGL, SSC CHSL]
    triggers: ["simplify", "is equal to", "equals", "\\(1 ?[−-] ?sin", "1 ?[−-] ?cos", "sec ?θ ?[−-]"]
    when: "A long trig expression is to be simplified and the options are trig functions of θ."
    idea: "Pick θ = 30° or 60°, not 0° or 45° if those make options coincide. Compute the expression as a number, then compute each option as a number, and pick the match."
    steps:
      - "Choose θ = 60° (or 30°) from the value table."
      - "Evaluate the question to one decimal or a surd."
      - "Evaluate each option the same way and keep the match."
    example: {question: "sec θ − tan θ · sin θ equals which option?", answer: "cos θ", seconds: 12}
    caution: "If two options give the same value, test a second angle."
    speed_seconds: 12
    proof: {kind: numeric, expr: "sec(pi/3) - tan(pi/3)*sin(pi/3)", expected: "cos(pi/3)"}

subject: mensuration
tricks:
  - id: mens-cone-hemisphere-cylinder
    name: "Cone : hemisphere : cylinder = 1 : 2 : 3"
    subject: mensuration
    topic: volume cone cylinder hemisphere
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["cone", "hemisphere", "cylinder", "same base", "same radius"]
    when: "Cone, hemisphere and cylinder with equal radius and height equal to the radius."
    idea: "Volumes are in the ratio 1 : 2 : 3. Also a cone is one-third of a cylinder with the same base and height."
    steps: ["Check radius = height.", "Use the ratio 1:2:3 for volumes."]
    example: {question: "Cone, hemisphere, cylinder with same r and h = r. Volume ratio?", answer: "1:2:3", seconds: 4}
    speed_seconds: 4
    proof: {kind: identity, vars: [r], domain: positive, lhs: "(pi*r**2*r)/((1/3)*pi*r**2*r)", rhs: "3"}

  - id: mens-area-radius-change
    name: "Area change when a length changes by x%"
    subject: mensuration
    topic: percentage change area circle square
    exams: [SSC CGL, SSC CHSL, Banking]
    triggers: ["radius is increased", "side is increased", "increased by", "area increases", "percent change in area"]
    when: "Radius or side of a circle or square changes by x% and the area change is asked."
    idea: "Area changes by 2x + x²/100 percent (use −x for a decrease)."
    steps: ["Area depends on the square, so the same percent change is applied twice.", "Use a + b + ab/100 with a = b = x."]
    example: {question: "Radius increased by 10%. Area increases by?", answer: "21%", seconds: 5}
    speed_seconds: 5
    proof: {kind: identity, vars: [x], lhs: "((1 + x/100)**2 - 1)*100", rhs: "2*x + x**2/100"}

  - id: mens-rectangle-plus-minus
    name: "Length +x% and breadth −x% means area −x²/100 %"
    subject: mensuration
    topic: rectangle percentage area
    exams: [SSC CGL, SSC CHSL]
    triggers: ["length is increased", "breadth is decreased", "rectangle", "length and breadth"]
    when: "One side up by x% and the other down by the same x%."
    idea: "Net area change = −x²/100 percent."
    steps: ["Write the changes as +x and −x.", "Use a + b + ab/100 with a = x and b = −x, which leaves −x²/100."]
    example: {question: "Length +20%, breadth −20%. Area change?", answer: "−4%", seconds: 4}
    speed_seconds: 4
    proof: {kind: identity, vars: [x], lhs: "((1 + x/100)*(1 - x/100) - 1)*100", rhs: "-x**2/100"}

  - id: mens-cuboid-cube-diagonal
    name: "Space diagonal and longest rod"
    subject: mensuration
    topic: cube cuboid diagonal
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["diagonal", "longest rod", "cube", "cuboid", "room"]
    when: "Longest rod that fits in a room or box."
    idea: "Cuboid diagonal = √(l²+b²+h²); cube diagonal = a√3. Look for a triple like 2-3-6-7 or 1-2-2-3."
    steps: ["Add the squares of l, b and h.", "Take the root (spot the perfect square)."]
    example: {question: "Room 12 × 4 × 3 m. Longest rod?", answer: "13 m", seconds: 6}
    speed_seconds: 6
    proof: {kind: identity, vars: [a], domain: positive, lhs: "sqrt(a**2 + a**2 + a**2)", rhs: "sqrt(3)*a"}

  - id: mens-sphere-volume-area-ratio
    name: "Sphere: V / A = r/3"
    subject: mensuration
    topic: sphere volume surface
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["sphere", "surface area", "volume", "numerically equal"]
    when: "Volume and surface area of a sphere are compared."
    idea: "V = (4/3)πr³ and A = 4πr², so V/A = r/3. If V = A numerically then r = 3."
    steps: ["Divide V by A.", "Solve r/3 = the given ratio."]
    example: {question: "Sphere volume numerically equals its surface area. r?", answer: "3", seconds: 5}
    speed_seconds: 5
    proof: {kind: identity, vars: [r], domain: positive, lhs: "(4/3*pi*r**3)/(4*pi*r**2)", rhs: "r/3"}

  - id: mens-ring-area
    name: "Ring area = π(R+r)(R−r)"
    subject: mensuration
    topic: circle ring path area
    exams: [SSC CGL, SSC CHSL]
    triggers: ["ring", "path around", "annulus", "concentric", "garden"]
    when: "Path around a circular ground or two concentric circles."
    idea: "Area of the ring = π(R² − r²) = π(R+r)(R−r)."
    steps: ["Find R and r.", "Multiply (R+r) by (R−r) first, then by π."]
    example: {question: "R = 14, r = 7. Ring area?", answer: "462", seconds: 6}
    speed_seconds: 6
    proof: {kind: identity, vars: [R, r], lhs: "pi*(R**2 - r**2)", rhs: "pi*(R + r)*(R - r)"}

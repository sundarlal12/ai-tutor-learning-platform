subject: geometry
tricks:
  - id: geo-incentre-angle
    name: "Angle at the incentre = 90° + A/2"
    subject: geometry
    topic: triangle incentre angle bisector
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["incentre", "incenter", "angle bisectors", "bisectors of"]
    when: "Angle bisectors of B and C meet at I and ∠BIC is asked."
    idea: "∠BIC = 90° + A/2 (and ∠BOC = 2A at the circumcentre, ∠BHC = 180° − A at the orthocentre)."
    steps: ["Name the angle at the third vertex A.", "Add 90° to half of A."]
    example: {question: "Incentre I of triangle ABC with ∠A = 60°. Find ∠BIC.", answer: "120°", seconds: 5}
    speed_seconds: 5
    proof: {kind: identity, vars: [A], lhs: "180 - (180 - A)/2", rhs: "90 + A/2"}

  - id: geo-centre-angle-trio
    name: "Circumcentre 2A, orthocentre 180−A"
    subject: geometry
    topic: triangle circumcentre orthocentre
    exams: [SSC CGL, SSC CHSL]
    triggers: ["circumcentre", "circumcenter", "orthocentre", "orthocenter"]
    when: "Angle subtended at the circumcentre O or orthocentre H by a side."
    idea: "∠BOC = 2∠A (central angle) and ∠BHC = 180° − ∠A."
    steps: ["Identify the vertex opposite the side.", "Circumcentre: double it. Orthocentre: subtract from 180°."]
    example: {question: "O is the circumcentre, ∠A = 50°. ∠BOC?", answer: "100°", seconds: 4}
    speed_seconds: 4

  - id: geo-right-triangle-inradius
    name: "Right-triangle inradius (a+b−c)/2"
    subject: geometry
    topic: triangle inradius circumradius right
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["inradius", "circumradius", "right.angled", "right angled"]
    when: "Right triangle: inradius or circumradius asked."
    idea: "r = (a + b − c)/2 where c is the hypotenuse. Circumradius R = c/2."
    steps: ["Find the hypotenuse c (use triples).", "r = (sum of legs − hypotenuse)/2."]
    example: {question: "Right triangle with sides 6, 8, 10. Inradius?", answer: "2", seconds: 6}
    speed_seconds: 6
    proof: {kind: identity, vars: [a, b], domain: positive, lhs: "(a + b - sqrt(a**2 + b**2))/2", rhs: "a*b/(a + b + sqrt(a**2 + b**2))"}

  - id: geo-polygon-angles
    name: "Polygon interior and exterior angles"
    subject: geometry
    topic: polygon regular angles
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["polygon", "regular", "interior angle", "exterior angle", "hexagon", "octagon"]
    when: "Regular polygon angles or number of sides."
    idea: "Exterior angle = 360/n. Interior = 180 − 360/n. Work with the exterior angle first."
    steps: ["Find the exterior angle (180 − interior).", "n = 360/exterior."]
    example: {question: "Each interior angle is 150°. How many sides?", answer: "12", seconds: 5}
    speed_seconds: 5
    proof: {kind: identity, vars: [n], lhs: "(n - 2)*180/n", rhs: "180 - 360/n"}

  - id: geo-pythagorean-triples
    family: pattern
    name: "Pythagorean triples"
    subject: geometry
    topic: right triangle sides triples pythagoras
    exams: [SSC CGL, SSC CHSL, Railway, Banking]
    triggers: ["hypotenuse", "right angle", "perpendicular", "pythagoras", "triangle with sides"]
    when: "Right triangle with two sides known."
    idea: "Memorise 3-4-5, 5-12-13, 8-15-17, 7-24-25, 20-21-29 and their multiples. Match first, calculate never."
    steps: ["Find a known triple (or a multiple) matching the two given sides.", "Read the third side."]
    example: {question: "Legs 9 and 12. Hypotenuse?", answer: "15", seconds: 3}
    speed_seconds: 3
    proof: {kind: numeric, expr: "20**2 + 21**2 - 29**2", expected: "0"}

  - id: geo-equilateral-formulas
    name: "Equilateral triangle: √3/2 and √3/4"
    subject: geometry
    topic: equilateral triangle area height
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["equilateral"]
    when: "Equilateral triangle height, area or inradius."
    idea: "Height = (√3/2)a, area = (√3/4)a², inradius = a/(2√3), circumradius = a/√3."
    steps: ["Write the side a.", "Plug into the matching formula."]
    example: {question: "Side 4 cm equilateral. Area?", answer: "4√3 cm²", seconds: 4}
    speed_seconds: 4
    proof: {kind: identity, vars: [a], domain: positive, lhs: "(1/2)*a*(sqrt(3)/2*a)", rhs: "sqrt(3)/4*a**2"}

  - id: geo-common-tangent
    name: "Common tangent length"
    subject: geometry
    topic: circle tangents
    exams: [SSC CGL, SSC CHSL]
    triggers: ["common tangent", "direct common tangent", "transverse", "two circles"]
    when: "Two circles with centres d apart and radii r1, r2."
    idea: "Direct = √(d² − (r1−r2)²); transverse = √(d² − (r1+r2)²)."
    steps: ["Find d, r1, r2.", "Pick direct (minus) or transverse (plus).", "Use a Pythagoras triple if possible."]
    example: {question: "d = 13, radii 8 and 3. Direct tangent?", answer: "12", seconds: 6}
    speed_seconds: 6
    proof: {kind: numeric, expr: "sqrt(13**2 - (8 - 3)**2)", expected: "12"}

  - id: geo-similar-triangles-ratio
    name: "Area ratio = square of side ratio"
    subject: geometry
    topic: similar triangles ratio area
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["similar triangles", "ratio of the areas", "parallel to", "bpt"]
    when: "Similar triangles (or a line parallel to a side) and an area or perimeter ratio."
    idea: "Sides : perimeters : heights = k, areas = k²."
    steps: ["Find the ratio of corresponding sides.", "Square it for area."]
    example: {question: "Sides ratio 2:3. Area ratio?", answer: "4:9", seconds: 3}
    speed_seconds: 3
    proof: {kind: identity, vars: [b, h, k], lhs: "(1/2)*(k*b)*(k*h)", rhs: "k**2*((1/2)*b*h)"}

  - id: geo-option-backsolve
    family: option_elimination
    name: "Option back-solving (geometry)"
    subject: geometry
    topic: options back substitution
    exams: [SSC CGL, SSC CHSL]
    triggers: ["find the value", "find the length", "find the angle"]
    when: "Lengths or angles with integer options."
    idea: "Test options against a known triple or angle sum."
    steps: ["Pick an option.", "Check it against the triangle or angle-sum rule."]
    example: {question: "Angle problems with options", answer: "test options", seconds: 15}
    speed_seconds: 15

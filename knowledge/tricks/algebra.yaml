# Algebra tricks. Every trick with a `proof` is machine-checked by tools/validate_tricks.py (SymPy).
subject: algebra
tricks:
  - id: alg-identity-a4-a2b2-b4
    family: identity
    name: "a⁴ + a²b² + b⁴ factor identity"
    subject: algebra
    topic: identities
    exams: [SSC CGL, SSC CHSL, Banking, Railway]
    triggers: ["a\\^4", "a⁴", "a\\^2 ?b\\^2", "a²b²", "b\\^4", "x\\^4 ?\\+ ?x\\^2 ?\\+ ?1"]
    when: "The question has a⁴ + a²b² + b⁴ and also a² + ab + b² (or a² − ab + b²)."
    idea: "a⁴ + a²b² + b⁴ = (a² + ab + b²)(a² − ab + b²). Divide to get the missing factor."
    steps:
      - "Spot a⁴ + a²b² + b⁴ and write it as (a²+ab+b²)(a²−ab+b²)."
      - "Put the known value of a²+ab+b² and divide to get a²−ab+b²."
      - "Subtract or add the two to isolate ab or a²+b²."
    example: {question: "a⁴+b⁴+a²b²=8 and a²+b²+ab=4, find ab", answer: "1", seconds: 10}
    speed_seconds: 10
    proof: {kind: identity, vars: [a, b], lhs: "a**4 + a**2*b**2 + b**4", rhs: "(a**2 + a*b + b**2)*(a**2 - a*b + b**2)"}

  - id: alg-sum-diff-substitution
    family: substitution
    name: "Substitute x = a²+b², y = ab"
    subject: algebra
    topic: substitution symmetric
    exams: [SSC CGL, SSC CHSL, Banking]
    triggers: ["a\\^4", "a⁴", "a\\^2 ?\\+ ?b\\^2", "a² ?\\+ ?b²", "ab ="]
    when: "Symmetric expressions in a and b. Rewrite everything with x = a²+b² and y = ab."
    idea: "a⁴ + b⁴ = x² − 2y². Turn the system into two small equations in x and y."
    steps:
      - "Let x = a²+b² and y = ab."
      - "Rewrite a⁴+b⁴ as x² − 2y², a²b² as y²."
      - "Factor x² − y² = (x−y)(x+y) and use the known x+y."
    example: {question: "a⁴+b⁴+a²b²=8 and a²+b²+ab=4, find ab", answer: "1", seconds: 25}
    speed_seconds: 25
    proof: {kind: identity, vars: [a, b], lhs: "a**4 + b**4", rhs: "(a**2 + b**2)**2 - 2*(a*b)**2"}

  - id: alg-x-plus-1-over-x
    family: identity
    name: "x + 1/x powers ladder"
    subject: algebra
    topic: reciprocals powers
    exams: [SSC CGL, SSC CHSL, Banking, Railway]
    triggers: ["x ?\\+ ?1 ?/ ?x", "x \\+ \\\\frac\\{1\\}\\{x\\}", "1/x", "reciprocal"]
    when: "Given x + 1/x = k and asked for x², x³ or x⁴ with reciprocals."
    idea: "x²+1/x² = k²−2 and x³+1/x³ = k³−3k. Square or cube once, never solve for x."
    steps:
      - "Square both sides: x² + 1/x² = k² − 2."
      - "For cubes use k³ − 3k."
      - "For x⁴+1/x⁴ square the x² result again: (k²−2)² − 2."
    example: {question: "x + 1/x = 3, find x³ + 1/x³", answer: "18", seconds: 10}
    speed_seconds: 10
    proof: {kind: identity, vars: [x], lhs: "x**3 + 1/x**3", rhs: "(x + 1/x)**3 - 3*(x + 1/x)"}

  - id: alg-sum-of-cubes-zero
    family: identity
    name: "a + b + c = 0 means a³+b³+c³ = 3abc"
    subject: algebra
    topic: cubes identities
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["a ?\\+ ?b ?\\+ ?c ?= ?0", "a³ ?\\+ ?b³", "a\\^3 ?\\+ ?b\\^3", "3abc"]
    when: "Sum of three numbers is zero (or the three differences add to zero) and cubes appear."
    idea: "a³+b³+c³ − 3abc = (a+b+c)(a²+b²+c²−ab−bc−ca). If a+b+c = 0 the right side is 0."
    steps:
      - "Check a+b+c = 0 (also check if terms like (x−y), (y−z), (z−x) add to 0)."
      - "Replace the sum of cubes by 3abc."
    example: {question: "a+b+c=0, find (a³+b³+c³)/abc", answer: "3", seconds: 8}
    caution: "Only when the three numbers add up to exactly zero."
    speed_seconds: 8
    proof: {kind: identity, vars: [a, b, c], lhs: "a**3 + b**3 + c**3 - 3*a*b*c", rhs: "(a + b + c)*(a**2 + b**2 + c**2 - a*b - b*c - c*a)"}

  - id: alg-sqrt-pair-difference
    family: identity
    name: "Subtract the square-root pair"
    subject: algebra
    topic: surds radicals
    exams: [SSC CGL, SSC CHSL, Banking]
    triggers: ["sqrt\\(.*\\) ?\\+ ?sqrt\\(", "√\\(.*\\) ?\\+ ?√\\(", "√\\(4x", "square root.*equal"]
    when: "√A + √B = k is given and A − B is a constant."
    idea: "(√A − √B)(√A + √B) = A − B, so √A − √B = (A − B)/k. Add and subtract the two equations."
    steps:
      - "Find A − B (the constant difference of the insides)."
      - "Compute √A − √B = (A − B)/k and rationalise if k has a surd."
      - "Add to the original to get 2√A, then square."
    example: {question: "√(4x−9)+√(4x+9)=5+√7, find x", answer: "4", seconds: 15}
    speed_seconds: 15
    proof: {kind: identity, vars: [A, B], lhs: "(sqrt(A) - sqrt(B))*(sqrt(A) + sqrt(B))", rhs: "A - B", domain: positive}

  - id: alg-sqrt-guess-perfect-square
    family: guess
    name: "Guess the perfect-square root"
    subject: algebra
    topic: surds radicals guessing
    exams: [SSC CGL, SSC CHSL, Banking]
    triggers: ["√\\(.*\\) ?\\+ ?√\\(", "sqrt\\(.*\\) ?\\+ ?sqrt\\(", "= ?\\d ?\\+ ?√"]
    when: "The right side is an integer plus a surd, like 5 + √7."
    idea: "Split the right side into two roots: 5 = √25 and √7. Set each inside equal to 25 and 7 and test."
    steps:
      - "Write the right side as √(perfect square) + √(surd)."
      - "Set the larger inside equal to the perfect square and solve for x."
      - "Verify the other root matches."
    example: {question: "√(4x−9)+√(4x+9)=5+√7, find x", answer: "4", seconds: 10}
    caution: "A guess is only accepted after you verify the second root."
    speed_seconds: 10

  - id: alg-three-squares-half-sum
    family: identity
    name: "a²+b²+c²−ab−bc−ca as half-sum of squares"
    subject: algebra
    topic: identities squares
    exams: [SSC CGL, SSC CHSL, Railway]
    triggers: ["a² ?\\+ ?b² ?\\+ ?c² ?[−-] ?ab", "ab ?[−-] ?bc", "a\\^2 ?\\+ ?b\\^2 ?\\+ ?c\\^2"]
    when: "Consecutive numbers or three close numbers with a²+b²+c²−ab−bc−ca."
    idea: "a²+b²+c²−ab−bc−ca = ½[(a−b)²+(b−c)²+(c−a)²]. For consecutive numbers it equals 3."
    steps:
      - "Compute the three differences a−b, b−c, c−a."
      - "Square, add and halve."
    example: {question: "a=101, b=102, c=103, find a²+b²+c²−ab−bc−ca", answer: "3", seconds: 8}
    speed_seconds: 8
    proof: {kind: identity, vars: [a, b, c], lhs: "a**2 + b**2 + c**2 - a*b - b*c - c*a", rhs: "((a-b)**2 + (b-c)**2 + (c-a)**2)/2"}

  - id: alg-cube-from-sum-and-product
    family: identity
    name: "a³+b³ from a+b and ab"
    subject: algebra
    topic: cubes identities
    exams: [SSC CGL, SSC CHSL, Banking]
    triggers: ["a ?\\+ ?b ?=", "ab ?=", "a³", "a\\^3"]
    when: "a+b and ab are known and a³+b³ (or a²+b²) is needed."
    idea: "a³+b³ = (a+b)³ − 3ab(a+b) and a²+b² = (a+b)² − 2ab."
    steps:
      - "Write the needed expression with only a+b and ab."
      - "Substitute the numbers."
    example: {question: "a+b=5, ab=6, find a³+b³", answer: "35", seconds: 10}
    speed_seconds: 10
    proof: {kind: identity, vars: [a, b], lhs: "a**3 + b**3", rhs: "(a + b)**3 - 3*a*b*(a + b)"}

  - id: alg-option-backsolve
    family: option_elimination
    name: "Option back-solving (algebra)"
    subject: algebra
    topic: options back substitution
    exams: [SSC CGL, SSC CHSL, Banking, Railway]
    triggers: ["find the value of", "then the value", "value of x", "value of ab"]
    when: "Options are small integers and the equation is quick to evaluate."
    idea: "Plug the middle option first, use the result to decide to go up or down, and eliminate by sign, parity or size."
    steps:
      - "Pick the option that is easiest to compute."
      - "Test it in the original equation, not a derived one."
      - "Use inequality or parity to cut the rest."
    example: {question: "√(4x−9)+√(4x+9)=5+√7, options 4,5,7,3", answer: "4", seconds: 20}
    speed_seconds: 20

  - id: alg-linear-eq-ratio
    name: "Ratio shortcut for two linear equations"
    subject: algebra
    topic: linear equations simultaneous
    exams: [SSC CGL, SSC CHSL, Banking]
    triggers: ["simultaneous", "pair of linear", "a1x", "x ?\\+ ?y ?=", "x ?[−-] ?y ?="]
    when: "Two equations x+y = p and x−y = q."
    idea: "Add to get 2x = p+q and subtract to get 2y = p−q. Never substitute."
    steps:
      - "Add the equations to get x = (p+q)/2."
      - "Subtract to get y = (p−q)/2."
    example: {question: "x+y=10, x−y=2, find xy", answer: "24", seconds: 10}
    speed_seconds: 10
    proof: {kind: identity, vars: [p, q], lhs: "((p + q)/2)*((p - q)/2)", rhs: "(p**2 - q**2)/4"}

  - id: alg-plug-values-polynomial
    family: plug_values
    name: "Put x = 0, 1, −1 to find coefficients or test options"
    subject: algebra
    topic: polynomial identity coefficients plugging values
    exams: [SSC CGL, SSC CHSL, Banking, Railway]
    triggers: ["x ?\\^2 ?\\+ ?px", "coefficient", "for all x", "identity", "if p\\(x\\)", "x² ?\\+ ?px", "remainder when", "divisible by x"]
    when: "Two polynomial expressions are equal for all x, or a polynomial remainder or option expression is asked."
    idea: "If two expressions are equal for every x, they are equal at x = 0, 1, −1. Put those values to get small equations for the unknowns. Remainder when f(x) is divided by (x − a) is f(a)."
    steps:
      - "Put x = 0 to get the constant term."
      - "Put x = 1 (and x = −1 if needed) to get the sum of the other coefficients."
      - "Check the surviving option by putting x = 2 as a final test."
    example: {question: "(x + 2)(x + 3) = x² + px + q. Find p + q.", answer: "11 (put x = 1: 12 = 1 + p + q)", seconds: 6}
    caution: "Only valid when the equality holds for all x. For an equation true for particular x only, solve it."
    speed_seconds: 6
    proof: {kind: numeric, expr: "(1 + 2)*(1 + 3) - 1", expected: "11"}

  - id: alg-quadratic-sum-product
    family: formula
    name: "Quadratic roots: sum = −b/a, product = c/a"
    subject: algebra
    topic: quadratic equation roots alpha beta
    exams: [SSC CGL, SSC CHSL, Banking, Railway]
    triggers: ["roots of", "alpha", "α", "β", "quadratic", "x² ?[+−-]", "x\\^2 ?[+-]", "sum of the roots", "product of the roots", "equation whose roots"]
    when: "A quadratic ax² + bx + c = 0 and an expression in its two roots α and β."
    idea: "α + β = −b/a and αβ = c/a. Then α² + β² = (α+β)² − 2αβ and 1/α + 1/β = (α+β)/αβ. Never find the roots themselves."
    steps:
      - "Read off the sum −b/a and product c/a."
      - "Write the asked expression using only the sum and product."
      - "Substitute the numbers."
    example: {question: "α, β are roots of x² − 5x + 6 = 0. Find α² + β².", answer: "13", seconds: 8}
    speed_seconds: 8
    proof: {kind: identity, vars: [a, b], lhs: "a**2 + b**2", rhs: "(a + b)**2 - 2*a*b"}

  - id: alg-quadratic-discriminant-conditions
    family: formula
    name: "Quadratic conditions: equal, reciprocal and opposite roots"
    subject: algebra
    topic: quadratic discriminant condition value of k
    exams: [SSC CGL, SSC CHSL, Banking]
    triggers: ["equal roots", "real roots", "reciprocal", "value of k", "discriminant", "one root is", "roots are equal", "no real roots"]
    when: "A quadratic has an unknown k and a condition on its roots."
    idea: "Equal roots: b² = 4ac. Real roots: b² ≥ 4ac. Reciprocal roots: a = c. Roots equal and opposite: b = 0. One root is double the other: 2b² = 9ac. Also |α − β| = √(b² − 4ac)/|a|."
    steps:
      - "Match the condition to the rule."
      - "Write the rule with k and solve the small equation."
    example: {question: "x² − 5x + 6 = 0: what is |α − β|?", answer: "1", seconds: 6}
    caution: "Remember the case a = 0 and check that the quadratic stays quadratic."
    speed_seconds: 6
    proof: {kind: identity, vars: [a, b], lhs: "(a - b)**2", rhs: "(a + b)**2 - 4*a*b"}

  - id: alg-quadratic-split-middle
    family: pattern
    name: "Factor by sum and product (split the middle term)"
    subject: algebra
    topic: quadratic factorisation solve roots
    exams: [SSC CGL, SSC CHSL, Railway, Banking]
    triggers: ["solve", "roots", "x² ?[+−-] ?\\d+x ?[+−-] ?\\d+", "factori", "x\\^2 ?[+-]"]
    when: "Solving x² + bx + c = 0 with integer roots."
    idea: "Find two numbers with sum b and product c; the roots are their negatives. For ax² + bx + c find two numbers with sum b and product ac, then split the middle term."
    steps:
      - "List factor pairs of c (or ac) and find the pair that adds to b."
      - "The roots are the negatives of that pair (for the monic case)."
      - "Check with the sum and product of roots."
    example: {question: "Solve x² + 7x + 12 = 0", answer: "x = −3, −4", seconds: 6}
    speed_seconds: 6
    proof: {kind: numeric, expr: "3*4", expected: "12"}
